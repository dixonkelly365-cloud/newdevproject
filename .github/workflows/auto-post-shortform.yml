name: Auto-generate and post SHORT-form video

on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch: {}

jobs:
  make-and-post-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Generate money/finance fact script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generateStory.js

      - name: Fetch real photos (Ken Burns effect, A/B split)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node src/fetchStockPhotos.js

      - name: Generate narration
        run: node src/tts.js

      - name: Assemble final video
        run: node src/assembleVideo.js

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          PRIVACY_STATUS: public
        run: node src/uploadYoutube.js

      - name: Commit topic history so tomorrow's video never repeats today's
        run: |
          git config user.name "auto-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output-state/history-topics.json
          git diff --staged --quiet || git commit -m "auto: record covered topic"
          # Pull first with rebase — the short-form and long-form workflows
          # both write to this same file, so if they ever run close
          # together (including manual test triggers), one can push while
          # the other's already-fetched copy is stale. This makes the push
          # safe regardless of ordering.
          git pull --rebase origin main
          git push

      - name: Save as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final_video.mp4
          retention-days: 7
